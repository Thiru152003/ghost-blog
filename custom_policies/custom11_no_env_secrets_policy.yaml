metadata:
  name: "Ensure secrets are not defined in environment variables"
  id: "MASA_K8S_011"
  category: "Kubernetes Security"
  severity: "HIGH"

scope:
  provider: "kubernetes"

definition:
  cond_type: "attribute"
  resource_types:
    - "Deployment"
    - "StatefulSet"
    - "DaemonSet"
    - "Job"
  attribute: "spec.template.spec.containers[*].env[*].valueFrom.secretKeyRef"
  operator: "not_exists"
