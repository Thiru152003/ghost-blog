metadata:
  name: "Ensure resource limits are set"
  id: "CUSTOM_K8S_09991"
  category: "Kubernetes Security"
  severity: "HIGH"

scope:
  provider: "kubernetes"

definition:
  cond_type: "attribute"
  resource_types:
    - "Pod"
    - "Deployment"
    - "StatefulSet"
  attribute: "spec.template.spec.containers[*].resources.limits"
  operator: "exists"
