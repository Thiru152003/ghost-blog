metadata:
  name: "Do not use or assume default namespace"
  id: "CKV_CUSTOM_003"
  category: "KUBERNETES"
  severity: "MEDIUM"
  description: "All Kubernetes resources must specify a non-default namespace. 'default' or missing is not allowed."

definition:
  and:
    - cond_type: "attribute"
      resource_types:
        - "Kubernetes::Generic"
      attribute: "metadata.namespace"
      operator: "exists"
    - cond_type: "attribute"
      resource_types:
        - "Kubernetes::Generic"
      attribute: "metadata.namespace"
      operator: "not_equals"
      value: "default"
    - cond_type: "attribute"
      resource_types:
        - "Kubernetes::Generic"
      attribute: "metadata.namespace"
      operator: "not_contains"
      value: "{{ .Values.namespace }}"
