metadata:
  name: "No default namespace usage"
  id: "CKV_CUSTOM_001"
  category: "KUBERNETES"
  severity: "MEDIUM"
  description: "Kubernetes resources should not use the default namespace. Specify a custom namespace explicitly."

definition:
  and:
    - cond_type: "attribute"
      resource_types:
        - "Kubernetes::Generic"
      attribute: "metadata.namespace"
      operator: "exists"
    - cond_type: "attribute"
      resource_types:
        - "Kubernetes::Generic"
      attribute: "metadata.namespace"
      operator: "not_equals"
      value: "default"
