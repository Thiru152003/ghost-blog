metadata:
  name: "Ensure 'default' namespace is not used"
  id: "MASA_K8S_013"
  category: "Kubernetes Best Practices"
  severity: "MEDIUM"

scope:
  provider: "kubernetes"

definition:
  cond_type: "not"
  conditions:
    - cond_type: "attribute"
      attribute: "metadata.namespace"
      operator: "equals"
      value: "default"
    - cond_type: "attribute"
      attribute: "metadata.namespace"
      operator: "exists"
      value: false
