metadata:
  name: "CKV_CUSTOM_001"
  category: "KUBERNETES"
  id: "MASA_K8S_013"
  guidelines: "Avoid using the default namespace in Kubernetes resources. Always specify a custom namespace explicitly."
  severity: "MEDIUM"

definition:
  cond_type: "attribute"
  resource_types:
    - "Kubernetes::ConfigMap"
    - "Kubernetes::Deployment"
    - "Kubernetes::Service"
    - "Kubernetes::Pod"
    - "Kubernetes::Ingress"
    - "Kubernetes::Secret"
  attribute: "metadata.namespace"
  operator: "not_equals"
  value: "default"
