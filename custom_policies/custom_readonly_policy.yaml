metadata:
  name: "Ensure containers use read-only root filesystem"
  id: "CUSTOM_K8S_READONLY_001"
  category: "Kubernetes Security"
  severity: "MEDIUM"

scope:
  provider: "kubernetes"

definition:
  cond_type: "attribute"
  resource_types:
    - "Pod"
    - "Deployment"
    - "StatefulSet"
    - "DaemonSet"
    - "Job"
  attribute: "spec.template.spec.containers[*].securityContext.readOnlyRootFilesystem"
  operator: "equals"
  value: true
