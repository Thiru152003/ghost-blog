metadata:
  name: "Ensure sensitive environment variables are not set"
  id: "MASA_K8S_005"
  category: "Kubernetes Security"
  severity: "HIGH"

scope:
  provider: "kubernetes"

definition:
  cond_type: "attribute"
  resource_types:
    - "Deployment"
    - "StatefulSet"
    - "DaemonSet"
    - "Job"
  attribute: "spec.template.spec.containers[*].env[*].name"
  operator: "not_regex"
  value: ".*(SECRET|PASSWORD|TOKEN).*"
