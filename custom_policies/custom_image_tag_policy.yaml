metadata:
  name: "Ensure container image tag is not 'latest'"
  id: "MASA_K8S_005"
  category: "Kubernetes Best Practices"
  severity: "HIGH"

scope:
  provider: "kubernetes"

definition:
  cond_type: "attribute"
  resource_types:
    - "Deployment"
    - "StatefulSet"
    - "DaemonSet"
    - "Job"
  attribute: "spec.template.spec.containers[*].image"
  operator: "not_endswith"
  value: ":latest"
